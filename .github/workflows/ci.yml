name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements-backend.txt
            requirements-test.txt

      # Installs from requirements-backend.txt + requirements-test.txt,
      # NOT the full requirements.txt at the repo root -- that one also
      # installs the whole Jupyter/notebook stack (Week 1-9 pipeline),
      # which backend/agent.py and the test suite never import. Keeping
      # CI on the lean file matches what Dockerfile installs, so a CI
      # pass here means the Docker build below is likely to work too.
      - name: Install backend + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-backend.txt -r requirements-test.txt

      # sentence-transformers downloads all-MiniLM-L6-v2 from the HF
      # Hub the moment backend.agent is imported. Cache it so repeat CI
      # runs don't re-download the same ~90MB every time.
      - name: Cache HuggingFace model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      # No real API key needed: tests/conftest.py sets placeholder env
      # vars, and every test that touches the LLM
      # (tests/test_agent_logic.py) mocks `llm_with_tools` directly, so
      # nothing here ever makes a real OpenAI call. No GitHub Secrets
      # required for this job.
      - name: Run pytest
        env:
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
          OPENAI_BASE_URL: https://api.openai.com/v1
          API_KEY: ci-placeholder
        run: pytest -v

  docker-build:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Just verify the image builds and the container comes up healthy
      # -- no registry push, no deployment. This exists to catch
      # Dockerfile / requirements-backend.txt drift (works locally,
      # breaks in a clean build) before it reaches an actual deploy.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: investment-agent-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e OPENAI_API_KEY=ci-placeholder-not-a-real-key \
            -e OPENAI_BASE_URL=https://api.openai.com/v1 \
            -e API_KEY=ci-placeholder \
            investment-agent-backend:ci

          echo "Waiting for /health to respond..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "Container is healthy."
              exit 0
            fi
            sleep 2
          done

          echo "Container never became healthy. Recent logs:"
          docker logs smoke
          exit 1

      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs smoke || true

      - name: Clean up
        if: always()
        run: docker rm -f smoke || true
